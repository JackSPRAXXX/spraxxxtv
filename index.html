<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>SPRAXXX.TV</title>
  <meta name="description" content="SPRAXXX.TV — Beavis & Butt-Head Are Dead, streaming from the Internet Archive." />
  <style>
    html,body{
      margin:0;
      height:100%;
      background:#000;
      display:grid;
      place-items:center;
    }
    iframe{
      width:100%;
      height:100%;
      max-width:960px;
      max-height:720px;
      border:0;
      aspect-ratio:4/3;
      background:#000;
    }
  </style>
</head>
<body>
  <iframe
    src="https://archive.org/embed/s-7-ep-41-beavis-butthead-are-dead?autoplay=1"
    allow="autoplay; fullscreen"
    webkitallowfullscreen="true"
    mozallowfullscreen="true"
    allowfullscreen>
  </iframe>

  <script>
    // if the archive player ends, reload to start again
    window.addEventListener('message', e => {
      if (e.data === 'Ended') location.reload();
    });
    // force reload every 30 minutes just in case
    setTimeout(()=>location.reload(), 30*60*1000);
  </script>
</body>
</html>
